<title>Kanji Sea</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen app. Home = a living aquarium band over book-ordered "reefs" of kanji tiles;
   practice = a 田-grid writing board beside an octopus coach; game = a stingray carrying kanji. */
:root{
  --abyss:#06192a; --sea:#0d3655; --lagoon:#17607e; --foam:#ecf8f5; --mist:#a7cbd2;
  --coral:#ff8266; --kelp:#62d6a2; --sun:#ffd36e; --paper:#fbf6ea; --redline:#e8a297;
  --ink:#2b1846; --cinna:#5fc0ef; --ghost:#d3dde0; --sand:#e9cf98; --sand-deep:#c9a768;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --f-kanji:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--abyss);color:var(--foam);font-family:var(--f-ui);font-size:17px;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#app{position:relative;height:100%;background:linear-gradient(180deg,var(--lagoon) 0%,var(--sea) 38%,var(--abyss) 100%)}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* ---------- home ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-weight:900;font-size:clamp(28px,5vw,42px);letter-spacing:.06em;text-wrap:balance}
h1 small{display:block;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--mist);text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(6,25,42,.45);
  font-weight:700;font-variant-numeric:tabular-nums}
.tank{position:relative;height:clamp(200px,34vh,320px);border-radius:28px;overflow:hidden;
  background:linear-gradient(180deg,#2a8fae 0%,#16658a 55%,#0f4b6c 100%);box-shadow:inset 0 0 0 3px rgba(236,248,245,.18)}
.tank .rays{position:absolute;inset:0;background:
  linear-gradient(105deg,transparent 20%,rgba(255,255,255,.08) 24%,transparent 30%),
  linear-gradient(100deg,transparent 52%,rgba(255,255,255,.06) 56%,transparent 63%),
  linear-gradient(110deg,transparent 72%,rgba(255,255,255,.07) 75%,transparent 80%)}
.tank .sand{position:absolute;left:-5%;right:-5%;bottom:-30px;height:70px;border-radius:50% 50% 0 0/40px 40px 0 0;
  background:radial-gradient(circle at 20% 30%,var(--sand-deep) 2px,transparent 3px) 0 0/26px 18px,var(--sand)}
.weed{position:absolute;bottom:20px;width:14px;border-radius:14px 14px 4px 4px;background:var(--kelp);opacity:.85;
  transform-origin:bottom center;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(7deg)}}
.swimmer{position:absolute;left:var(--a);animation:swim var(--dur) ease-in-out infinite;animation-delay:var(--delay)}
.swimmer .bob{animation:bob 3.2s ease-in-out infinite alternate}
.swimmer .face{animation:face var(--dur) step-end infinite;animation-delay:var(--delay)}
.swimmer.still,.swimmer.still .face{animation:none}
.swimmer.still .bob{transform-origin:bottom center;animation:wobble 2.6s ease-in-out infinite alternate}
.tank .deco{position:absolute;left:14%;bottom:12px;width:44px}
.tank .swimmer,.tank .deco,.tank .host{cursor:pointer;-webkit-tap-highlight-color:transparent}
.swimmer.tapped .face>*,.deco.tapped>*{animation:jiggle .5s ease-out}
@keyframes jiggle{0%,100%{transform:scale(1)}30%{transform:scale(1.25,.8)}60%{transform:scale(.9,1.12)}}
@keyframes wobble{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes swim{0%,100%{left:var(--a)}50%{left:var(--b)}}
@keyframes face{0%{transform:scaleX(-1)}50%{transform:scaleX(1)}}
@keyframes bob{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
.emo{display:block;line-height:1}
.art svg{display:block;width:100%;height:auto}
.tank-empty{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(80%,420px);text-align:center;
  font-weight:700;font-size:18px;line-height:1.6;color:var(--foam);text-wrap:balance}
/* The host, a タカアシガニ, walks sideways along the sand and talks in a bubble over its head (it stops to talk).
   She can drag it up the tank; let go and it falls back to the sand. hostLoop moves it, so it has no CSS walk. */
.host{position:absolute;left:60%;bottom:4px;width:clamp(160px,17vw,200px);z-index:2;touch-action:none}
.host .legs{transform-box:view-box;transform-origin:80px 50px;animation:step .5s ease-in-out infinite alternate;animation-play-state:paused}
.host .legs.b{animation-direction:alternate-reverse}
.host.walking .legs{animation-play-state:running}
.host.held .legs{animation-duration:.12s;animation-play-state:running}
.puff{position:absolute;width:24px;height:12px;border-radius:50%;background:var(--sand);pointer-events:none}
.host.happy .tk{animation:hop .3s ease-out 6 alternate}
.host.tapped .tk{animation:jiggle .5s ease-out}
@keyframes step{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes hop{to{transform:translateY(-14px)}}
.host .say{position:absolute;right:30px;bottom:92%;width:max-content;max-width:min(340px,72vw);padding:10px 14px;border-radius:18px 18px 4px 18px;
  background:var(--foam);color:var(--ink);font-weight:700;font-size:17px;line-height:1.5;white-space:pre-line;text-align:left;
  opacity:0;transform:translateY(8px) scale(.9);transform-origin:bottom right;transition:opacity .25s,transform .25s;pointer-events:none}
.host.talking .say{opacity:1;transform:none}
/* Near the top of the tank the bubble goes under the crab, and near the left wall it opens to the right. */
.host.under .say{bottom:auto;top:92%;border-radius:4px 18px 18px 18px;transform-origin:top right}
.host.lefty .say{right:auto;left:30px;border-radius:18px 18px 18px 4px;transform-origin:bottom left}
.host.under.lefty .say{border-radius:18px 4px 18px 18px;transform-origin:top left}
.tank-empty{transition:opacity .25s}
.tank:has(.host.talking) .tank-empty{opacity:0}

.play{display:flex;gap:12px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;font-weight:900;font-size:20px;
  background:var(--sun);color:#3b2600;box-shadow:0 6px 0 #c99a2e}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #c99a2e}
.cta .ico{width:40px}

.reef{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:rgba(6,25,42,.42)}
.reef-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.reef h2{margin:0;font-size:22px;font-weight:900;letter-spacing:.04em}
.reef .book{margin:2px 0 0;font-size:13px;color:var(--mist);font-weight:500}
.reef .book b{font-variant-numeric:tabular-nums;color:var(--sun);font-weight:700}
.setgo{padding:10px 16px;border-radius:999px;background:var(--sun);color:#3b2600;font-weight:900;font-size:15px;flex:none}
.reef-head .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.setgo.test{background:#6aa6e8;color:#06192a}
.setgo.test small{font-size:13px}
.reward{width:64px;flex:none;text-align:center;font-size:11px;color:var(--mist);font-weight:700}
.reward .art{filter:grayscale(1) brightness(.55);opacity:.7}
.reward.got .art{filter:none;opacity:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:18px;
  background:var(--paper);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.tile .kj{font-family:var(--f-kanji);font-weight:600;font-size:46px;line-height:1.1}
.stars{display:flex;gap:4px}
.stars i{width:12px;height:12px;border-radius:50%;background:#dccfb3}
.stars i.on{background:var(--coral)}
.stars i.on.w{background:#2d9bc4}
.stars i.on.r{background:#e6a817}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mist);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.grownups{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mist)}
.grownups .pill{font-size:13px;padding:6px 12px}
.pill.nag{background:#ffd166;color:#22122f}
/* This week's kanji: a card at the top of the home screen, so there's no scrolling to find them. Its kanji glow in the book list too. */
.reef.week{background:linear-gradient(180deg,rgba(255,211,110,.2),rgba(6,25,42,.45) 55%);box-shadow:0 0 0 3px var(--sun),0 0 30px rgba(255,211,110,.35)}
.reef.week h2{font-family:var(--f-kanji);font-size:34px;line-height:1.15}
.reef.week h2 small{display:block;font-family:var(--f-ui);font-size:14px;letter-spacing:.12em;color:var(--sun);margin-bottom:2px}
.reef.week .tiles{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.reef.week .tile .kj{font-size:64px}
.reef.week .pass{display:inline-flex;align-items:center;padding:8px 14px;border-radius:999px;background:var(--kelp);color:#06192a;font-weight:900;font-size:15px}
.wknote{margin:0;font-size:15px;color:var(--mist);font-weight:700}
.reef.week.nudge{animation:nudge .5s ease 2}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
.reef.now{box-shadow:0 0 0 3px var(--sun)}
.reef.now h2::after{content:'こんしゅう';margin-left:10px;font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;color:#06192a;background:var(--sun);padding:3px 8px;border-radius:999px;vertical-align:middle}
/* ぼうけん and レース stay locked until this week's test is passed. */
.cta.locked{background:rgba(6,25,42,.55);color:var(--mist);box-shadow:0 6px 0 rgba(0,0,0,.3)}
.cta.locked .ico{opacity:.5}
.cta .lock{display:none;font-size:18px}
.cta.locked .lock{display:inline}
.grownups .wk{display:inline-flex;align-items:center;gap:4px}
.grownups .wk b{font-size:15px;color:var(--foam);min-width:96px;text-align:center}
footer{font-size:12px;color:var(--mist);line-height:1.6}
footer a{color:var(--mist)}

/* ---------- shared bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back,.navb,.chip{padding:10px 16px;border-radius:999px;background:rgba(6,25,42,.5);font-weight:700}
.navb{width:48px;height:48px;padding:0;font-size:26px;line-height:48px}
.nav{display:flex;gap:8px;align-items:center}
.sizes{display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(6,25,42,.5)}
.sizes button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.sizes button i{display:block;border:2.5px solid currentColor;border-radius:4px}
.sizes button[aria-pressed="true"]{background:var(--sun);color:#3b2600}

/* ---------- practice ---------- */
.practice{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.boardwrap{position:relative;flex:0 1 auto;width:calc(min(100%,62vh,560px)*var(--bs,1));max-width:100%;touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none}
#board{display:block;width:100%;height:auto;aspect-ratio:1;max-width:100%;border-radius:22px;background:var(--paper);
  touch-action:none;box-shadow:0 8px 0 rgba(0,0,0,.25)}
#board .grid{stroke:var(--redline);stroke-width:.5;stroke-dasharray:2 2;fill:none}
#board .ghost{stroke:var(--ghost);stroke-width:6.5;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke-opacity .25s}
#board.memory .ghost{stroke-opacity:0}
#board.peekfade .ghost{transition:stroke-opacity 1.6s ease-in}
#board .ink{stroke:var(--ink);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
#board .live{stroke:#5b3a8c;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
#board .live.bad{stroke:var(--coral);transition:opacity .45s;opacity:0}
/* In a test, each stroke she gets right shows the model stroke in light grey underneath hers. */
#board .model{stroke:#c6cfd3;stroke-width:6.5;fill:none;stroke-linecap:round;stroke-linejoin:round;animation:modelIn .5s ease-out}
@keyframes modelIn{from{opacity:0}}
#board .hint{stroke:var(--coral);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
#board .start{fill:var(--kelp);stroke:#fff;stroke-width:1}
#board .start.pulse{animation:pulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#board .num{font-family:var(--f-ui);font-weight:900;font-size:6px;fill:#d0573c;paint-order:stroke;stroke:#fff;stroke-width:1.6px}
#board .pop{fill:none;stroke:#5fc3e4;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:popb .7s ease-out forwards}
/* Finished: the ink turns blue and a kelp-green ring pulses out and stays round the board. */
#board.done-glow{box-shadow:0 8px 0 rgba(0,0,0,.25),0 0 0 6px var(--kelp);animation:doneRing .8s ease-out}
@keyframes doneRing{0%{box-shadow:0 8px 0 rgba(0,0,0,.25),0 0 0 0 var(--kelp)}45%{box-shadow:0 8px 0 rgba(0,0,0,.25),0 0 0 14px rgba(98,214,162,.5)}}
#board.done-glow .ink{stroke:#1f7a9c;transition:stroke .5s}
/* Near-perfect strokes: Cinnamoroll blue with a soft glow, then a spark races along them. */
#board .ink.blue{stroke:var(--cinna)}
#board .halo{stroke:#d4f0ff;stroke-width:11;fill:none;stroke-linecap:round;stroke-linejoin:round}
#board .spark{stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 2px #8ad8ff)}
#board .star{fill:#fff;stroke:var(--cinna);stroke-width:.7;transform-box:fill-box;transform-origin:center;opacity:0;animation:twinkle .9s ease-out forwards}
@keyframes twinkle{0%{transform:scale(0) rotate(0);opacity:1}55%{transform:scale(1.4) rotate(80deg);opacity:1}100%{transform:scale(.5) rotate(140deg);opacity:0}}
/* On a level up, the new level's animal jumps up out of the writing board and dances to a little tune. */
.cheer.party{container-type:inline-size}
.dancer{position:absolute;left:25%;bottom:4%;width:50%}
.dancer .move{animation:dance .38s ease-in-out infinite alternate;transform-origin:bottom center}
.dancer .move .emo{display:block;font-size:40cqw;line-height:1;text-align:center}
.dancer .note{position:absolute;font-size:9cqw;font-weight:900;color:var(--sun);opacity:0;animation:note 1.2s ease-out infinite}
@keyframes dance{from{transform:rotate(-12deg) scale(1.06,.94)}to{transform:translateY(-16px) rotate(12deg) scale(.95,1.06)}}
@keyframes note{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(-90px) scale(1.1);opacity:0}}
/* A kanji written cleanly without the guide brings out the animal for its level, popping in from the board's edge. */
.cheer{position:absolute;inset:0;overflow:hidden;border-radius:22px;pointer-events:none;z-index:3}
.cheer .pal{position:absolute;left:0;top:0;width:34%}
.cheer .pal.small{width:20%}
.cheer .pal .emo{display:block;font-size:min(110px,18vw);line-height:1;text-align:center}
.cheer .ear{transform-box:fill-box;animation:flapL .22s ease-in-out infinite alternate}
.cheer .ear.l{transform-origin:right center}
.cheer .ear.r{transform-origin:left center;animation-name:flapR}
/* All strokes near-perfect: the board goes dark and an anglerfish lights up the kanji with its lure. */
.cheer .spot{position:absolute;z-index:-1;width:800%;height:800%;left:-386%;top:-382%;opacity:0;
  background:radial-gradient(circle,rgba(255,246,190,.3) 0,rgba(255,246,190,.1) 4%,rgba(4,12,35,0) 6%,rgba(4,12,35,.86) 14%)}
.cheer svg{overflow:visible}
.cheer .lure{transform-box:fill-box;transform-origin:center}
/* No mistakes but some strokes only ok: a quick burst of bubbles rises up the board. */
.cheer .bub{position:absolute;border-radius:50%;border:2px solid rgba(95,192,239,.75);
  background:radial-gradient(circle at 32% 30%,#fff 0 18%,rgba(191,230,255,.45) 24%,rgba(191,230,255,.12) 70%)}
/* The first time a kanji is written from memory, a メンダコ flies across the screen ahead of the new friend. */
.flyer{position:fixed;left:0;top:28vh;width:150px;z-index:25;pointer-events:none}
.flyer .ear{transform-box:fill-box;animation:flapL .22s ease-in-out infinite alternate}
.flyer .ear.l{transform-origin:right center}
.flyer .ear.r{transform-origin:left center;animation-name:flapR}
@keyframes flapL{from{transform:rotate(18deg)}to{transform:rotate(-22deg)}}
@keyframes flapR{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.45)}}
@keyframes popb{from{transform:scale(.3);opacity:1}to{transform:scale(2.4);opacity:0}}

.panel{flex:1 1 300px;min-width:0;max-width:460px;display:flex;flex-direction:column;gap:14px}
.card{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:22px;background:rgba(6,25,42,.45)}
.bigk{font-family:var(--f-kanji);font-weight:600;font-size:72px;line-height:1;color:var(--paper)}
.reads{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:22px;font-weight:700}
.reads .w{font-family:var(--f-kanji);font-weight:600}
.reads .w.minor{font-size:17px;color:var(--mist)}
ruby rt{font-family:var(--f-ui);font-size:.5em;font-weight:700;color:var(--sun)}
.pic{font-size:30px;letter-spacing:2px;line-height:1.3;word-break:break-all}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--mist)}
.meta b{color:var(--foam);font-variant-numeric:tabular-nums}
.speak{padding:8px 14px;border-radius:999px;background:var(--lagoon);font-weight:700;color:var(--foam)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes button{padding:14px 6px;border-radius:18px;background:rgba(6,25,42,.5);font-weight:900;font-size:20px;display:flex;flex-direction:column;align-items:center;gap:2px}
.modes button small{font-size:11px;font-weight:700;color:var(--mist)}
.modes button[aria-pressed="true"]{background:var(--sun);color:#3b2600}
.modes button[aria-pressed="true"] small{color:#6b5214}
.coach{display:flex;gap:10px;align-items:flex-end}
.coach .art{width:76px;flex:none}
.bubble{position:relative;flex:1;min-width:0;padding:12px 16px;border-radius:20px 20px 20px 6px;background:var(--foam);color:var(--ink);
  font-weight:700;font-size:19px;line-height:1.5;min-height:52px}
.bubble.wiggle{animation:wig .4s}
@keyframes wig{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:15px}

/* ---------- quiz ---------- */
.qwrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.dots{display:flex;gap:8px}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(236,248,245,.25)}
.dots i.ok{background:var(--kelp)}.dots i.miss{background:var(--coral)}.dots i.now{box-shadow:0 0 0 3px var(--sun)}
.qstage{position:relative;height:clamp(160px,26vh,250px)}
.carrier{position:absolute;left:50%;top:50%;width:min(280px,70%);transform:translate(-50%,-50%)}
.carrier .art{width:100%}
.qcard{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);padding:8px 18px;border-radius:18px;background:var(--paper);
  color:var(--ink);font-family:var(--f-kanji);font-weight:600;font-size:clamp(48px,9vw,72px);line-height:1.15;white-space:nowrap;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.carrier.in{animation:glide 1s cubic-bezier(.2,.8,.3,1)}
.carrier.out{animation:flyoff .9s ease-in forwards}
@keyframes glide{from{transform:translate(-160%,-30%) rotate(-12deg)}to{transform:translate(-50%,-50%)}}
@keyframes flyoff{30%{transform:translate(-50%,-62%) rotate(6deg)}to{transform:translate(120%,-140%) rotate(18deg)}}
.qhint{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:30px;min-height:36px}
/* The options swim in a tank, each reading on a tag on a creature's back. Only painted parts and tags take taps. */
#qPlay{width:100%}
.qtank{height:clamp(300px,46vh,460px);flex:none}
.qtank .sand{bottom:0;height:60px;border-radius:50% 50% 0 0/12px 12px 0 0}
.qtank .weed{bottom:34px}
#qOpts,#qTags{position:absolute;inset:0;pointer-events:none}
.critter{position:absolute;left:0;top:0;padding:0;pointer-events:none}
.critter .body{width:100%;height:100%;transform-origin:50% 90%}

/* ---------- ぼうけん: a one-screen platformer; the crab climbs to the chest with the right kanji ---------- */
.bwrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#bPlay{width:100%}
.bq{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;min-height:48px;font-weight:900;font-size:clamp(24px,3.2vw,32px)}

.bmid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px}

.pad .jump svg{width:46%}
.pad .jump[data-k=JL] svg{transform:scaleX(-1)}
.pad button.on{background:rgba(255,211,110,.5);transform:scale(.93)}
/* ---------- レース: a kart race along the sea floor ---------- */
#rPlay{width:100%}
.rhud{position:absolute;inset:10px 14px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
  font-weight:900;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.45)}

.rbig{position:absolute;left:50%;top:38%;translate:-50% -50%;font-weight:900;font-size:clamp(60px,11vw,120px);color:var(--sun);
  text-shadow:0 4px 0 rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .2s}
.rbig.on{opacity:1}
.rbig.k{font-family:var(--f-kanji);color:var(--paper)}
.rpad button{position:absolute;bottom:14px;width:clamp(84px,10vw,112px);font-size:36px;background:rgba(6,25,42,.35)}
.rpad button[data-r=L]{left:14px}.rpad button[data-r=R]{right:14px}
/* The word sits on the road at the top, so she needn't look away from it. */
.rq{position:absolute;top:10px;left:50%;translate:-50% 0;z-index:2;flex-wrap:nowrap;white-space:nowrap;min-height:0;gap:12px;
  padding:6px 8px 6px 22px;border-radius:999px;background:rgba(6,25,42,.6);font-size:clamp(30px,4.4vw,46px)}
.rq:has(#rWord:empty){display:none}

#rWord.done{opacity:.45}
@media (orientation:portrait){
  .bmid{grid-template-columns:1fr 1fr;grid-template-areas:"s s" "l r"}
  .sbox{grid-area:s}.pad.left{grid-area:l}.pad.right{grid-area:r;flex-direction:row;justify-self:end;align-items:center}
}
.bcrab{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.bcrab .legs{transform-box:view-box;transform-origin:80px 50px;animation:step .5s ease-in-out infinite alternate;animation-play-state:paused}
.bcrab .legs.b{animation-direction:alternate-reverse}
.bcrab.walking .legs{animation-duration:.18s;animation-play-state:running}
.bcrab.climbing .legs{animation-duration:.3s;animation-play-state:running}
.bcrab.happy .tk{animation:hop .3s ease-out 6 alternate}
.bcrab.ouch .tk{animation:ouch .14s steps(2) 5}
@keyframes ouch{50%{opacity:.2}}
.bturtle{position:absolute;left:0;top:0;z-index:2;pointer-events:none;display:none}
.bdoor{position:absolute;left:0;top:0;overflow:hidden}
.bdoor div{height:100%;transition:transform .8s ease-in}
.bdoor svg{width:100%;height:100%;display:block}
.bdoor.open div{transform:translateY(-100%)}
.bkey{position:absolute;left:0;top:0;z-index:3;pointer-events:none;filter:drop-shadow(0 0 6px rgba(255,214,110,.8))}
.bkey svg{width:100%;display:block}
.bkey:not(.held) svg{animation:bob 1.2s ease-in-out infinite alternate}
.snakebox{position:absolute;left:0;top:0;overflow:hidden;pointer-events:none;z-index:3}
.snakebox .snake{position:absolute;inset:0;width:50%;transform:translateX(-100%)}
.snakebox .snake.roof{width:100%}
.snakebox .snake:not(.roof):not(.right){left:auto;right:0}
.tell{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.tell i{position:absolute;border-radius:50%;background:#0b111a}
.tell svg{position:absolute;width:70%;animation:flick 1.6s steps(1) infinite}
.tell b{position:absolute;width:12%;height:12%;border-radius:50%;background:#ffe45c;box-shadow:0 0 6px #ffe45c}
.tell.roof i{left:-20%;top:0;width:140%;height:26%}
.tell.roof svg{left:15%;top:8%;transform:rotate(90deg);transform-origin:20% 50%}
.tell.roof b{top:6%}.tell.roof b:nth-of-type(1){left:22%}.tell.roof b:nth-of-type(2){left:54%}
.tell.wall i{left:0;top:-30%;width:30%;height:110%}
.tell.wall svg{left:12%;top:28%}
.tell.wall b{left:6%}.tell.wall b:nth-of-type(1){top:-12%}.tell.wall b:nth-of-type(2){top:16%}
.tell.warn svg{animation-duration:.25s}
.tell.warn b{background:#ff4d6d;box-shadow:0 0 8px #ff4d6d}
@keyframes flick{0%{opacity:0}55%{opacity:1}70%{opacity:0}80%{opacity:1}92%{opacity:0}}
.bcrab .stars{position:absolute;left:50%;top:-30%;translate:-50% 0;font-size:150%;opacity:0;animation:spin 1s linear infinite}
.bcrab.stunned .stars{opacity:1}
.bcrab.stunned .tk{filter:saturate(.6) brightness(1.15)}
@keyframes spin{to{rotate:360deg}}
.sting{position:absolute;left:0;top:0;pointer-events:none}
.sting svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 5px rgba(214,150,255,.7))}
.sting .bell{transform-box:fill-box;transform-origin:50% 100%;animation:stingPulse 1.4s ease-in-out infinite alternate}
@keyframes stingPulse{to{transform:scale(1.08,.9)}}
.sting .bolt{opacity:0;animation:zap 1.3s steps(1) infinite}
.sting .bolt.b{animation-delay:-.7s}
@keyframes zap{0%{opacity:0}62%{opacity:1}72%{opacity:0}84%{opacity:1}92%{opacity:0}}
.chest{position:absolute;left:0;top:0;transition:opacity .4s,filter .4s}
.chest svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chest .lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.6,1)}
.chest .pearl{opacity:0;transition:opacity .3s .15s}
.chest span{position:absolute;left:50%;top:62%;translate:-50% -50%;display:grid;place-items:center;width:62%;aspect-ratio:1;border-radius:50%;
  background:var(--paper);color:var(--ink);font-family:var(--f-kanji);font-weight:600;line-height:1;box-shadow:0 0 0 3px #e2b048}
.chest.open .lid{transform:translateY(-6px) rotate(-28deg)}
.chest.open .pearl{opacity:1}
.chest.open span{background:var(--sun);animation:jiggle .5s ease-out 2}
.chest.no{filter:grayscale(.9) brightness(.7);animation:shake .45s}
.chest.fade{opacity:.35}
.chest.nudge{animation:shake .45s}
.bmsg{position:absolute;left:50%;top:10px;translate:-50% 0;z-index:3;padding:8px 18px;border-radius:999px;background:rgba(6,25,42,.75);
  font-weight:900;font-size:20px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
.bmsg.on{opacity:1}

/* ---------- celebration ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(3,14,24,.72);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cele{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px;border-radius:30px;
  background:linear-gradient(180deg,#2a8fae,#0f4b6c);text-align:center;box-shadow:0 0 0 4px var(--sun)}
.cele .art{width:150px;animation:bob 1.4s ease-in-out infinite alternate}
.cele .emo{font-size:120px}
.cele h2{margin:0;font-size:28px;font-weight:900}
.cele p{margin:0;font-size:18px;font-weight:700;color:var(--foam)}

/* ---------- SRS ---------- */
.tile{position:relative}
.tile .lvl{position:absolute;top:4px;right:4px;width:24px}
.tile .lvl .emo{font-size:20px}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.rung{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:16px;background:rgba(6,25,42,.42);font-weight:700;text-align:center}
.rung .art{width:40px;height:40px;display:grid;place-items:center}.rung .emo{font-size:32px}
.rung b{font-size:20px;font-variant-numeric:tabular-nums}
.rung small{font-size:11px;color:var(--mist)}
.cta[disabled]{background:rgba(6,25,42,.5);color:var(--mist);box-shadow:none;cursor:default}
.badge{min-width:34px;padding:2px 10px;border-radius:999px;background:var(--coral);color:#fff;font-variant-numeric:tabular-nums;text-align:center}
#practice.reviewing .lesson-only{display:none}
#practice:not(.reviewing) .review-only{display:none}
.prompt{display:flex;align-items:flex-end;gap:6px;font-weight:900;font-size:44px;line-height:1}
.pbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.pfuri{font-size:22px;font-weight:700;color:var(--sun);letter-spacing:.12em}
.pbox i{display:block;width:64px;height:64px;border:3px dashed var(--mist);border-radius:10px}
.sentence{font-size:26px;font-weight:700;line-height:1.7}
.sentence .pbox{display:inline-flex;vertical-align:bottom;margin:0 3px}
.sentence .pbox i{width:52px;height:52px}
.ybox{display:inline-flex;flex-direction:column;align-items:center;gap:4px;vertical-align:bottom;margin:0 3px}
.yfuri{display:flex;gap:3px}
.yfuri i{width:32px;height:34px;border:2px dashed var(--mist);border-radius:7px;font-style:normal;font-size:23px;line-height:31px;text-align:center;color:var(--sun)}
.yfuri i.now{border:2.5px solid var(--sun)}
.ybox b{font-family:var(--f-kanji);font-size:52px;line-height:1.05}
#practice.yomi .no-yomi{display:none}
.lvlnow{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--mist)}
.lvlnow .art{width:44px}.lvlnow .emo{font-size:36px}
.lvlnow .arrow{font-size:24px;color:var(--sun)}

/* ---------- test: inside a whale's mouth ---------- */
:root{--jaw:clamp(52px,8.5vh,80px)}
#practice.testing{padding-top:calc(var(--jaw) + 58px);padding-bottom:calc(var(--jaw) + 58px);
  background:radial-gradient(70% 22% at 50% 100%,#e98aa0 0 55%,transparent 56%),radial-gradient(120% 90% at 50% 45%,#a8395a 0%,#741d3a 55%,#3c0b1e 100%)}
#practice.testing .boardwrap{width:calc(min(100%,52vh,560px)*var(--bs,1))}
@media (orientation:portrait){#practice.testing .boardwrap{width:calc(min(100%,40vh,560px)*var(--bs,1))}}
#practice.testing .no-test{display:none!important}
/* After a mistake: optional practice squares like the drill book's, the first two with a faint outline to trace. */
.extra{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:center;touch-action:none}
.extra .chip{grid-column:1/-1;justify-self:end;padding:6px 16px}
/* While the squares are open the panel may grow wider, so they come out bigger. */
#practice.extra-on .panel{max-width:540px}
.extra[hidden]{display:none}
.extra svg{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:12px;background:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.extra .grid{stroke:var(--redline);stroke-width:.8;stroke-dasharray:2 2;fill:none}
.extra .ghost{stroke:var(--ghost);stroke-width:6.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.extra .ink{stroke:var(--ink);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media (orientation:portrait){#practice.testing.extra-on .boardwrap{width:calc(min(100%,30vh,560px)*var(--bs,1))}
  #practice.testing .extra{grid-template-columns:repeat(2,1fr);max-width:360px}}
.whale{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.whale.busy{pointer-events:auto}
/* Each jaw reaches 50vh past the screen edge, so closed they meet in the middle with no gaps. Its lip is one wide arc. */
.jaw{position:absolute;left:-4vw;width:108vw;height:calc(var(--jaw) + 50vh)}
.jaw.top{top:-50vh;background:#4f8bd0;
  border-radius:0 0 50% 50% / 0 0 calc(var(--jaw)*.7) calc(var(--jaw)*.7);box-shadow:inset 0 -12px 0 #e77a92}
.jaw.bot{top:calc(100% - var(--jaw));background:#cfe9fb;
  border-radius:50% 50% 0 0 / calc(var(--jaw)*.7) calc(var(--jaw)*.7) 0 0;box-shadow:inset 0 12px 0 #e77a92}
.tooth{position:absolute;width:clamp(24px,4.6vw,46px);aspect-ratio:20/28;translate:-50% 0}
.jaw.top .tooth{top:calc(100% - var(--jaw)*var(--k) - 9px)}
.jaw.bot .tooth{bottom:calc(100% - var(--jaw)*var(--k) - 9px);rotate:180deg}
.tooth::before{content:'';position:absolute;left:12%;right:12%;top:2px;height:9px;border-radius:50%;background:#b8475f}
.tooth svg{position:relative;display:block;width:100%;height:100%;overflow:visible;transform:scaleY(0);transform-origin:top center}
.tooth.on svg{transform:none;animation:toothIn .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes toothIn{0%{transform:scale(.5,0);filter:drop-shadow(0 0 0 #fff)}60%{filter:drop-shadow(0 0 8px #fff)}100%{filter:drop-shadow(0 0 0 #fff)}}
.gulp{position:absolute;left:50%;top:50%;width:min(320px,55vw);opacity:0;translate:-50% -50%}

/* 100% on a test: a line of sea animals does the chicken dance. Tap to skip. */
.chicken{position:fixed;inset:0;z-index:18;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;background:rgba(40,6,22,.55)}
.chicken .cap{font-weight:900;font-size:clamp(36px,7vw,64px);color:var(--sun);text-shadow:0 4px 0 rgba(0,0,0,.35);min-height:1.3em}
.chicken .line{display:flex;gap:2vw;align-items:flex-end}
.chicken .hen{width:min(150px,17vw)}
.chicken .hen .emo{font-size:min(130px,15vw)}
.chicken .pop{position:absolute;font-size:34px}

/* Then a fossil to dig up: rub off the loose sand and the rock under it. Each set has its own fossil, shown next to the set. */
.dig{position:fixed;inset:0;z-index:19;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;
  padding:16px;background:radial-gradient(120% 90% at 50% 40%,#4a3522 0%,#2a1c10 70%,#160e07 100%)}
.dig .cap{font-weight:900;font-size:clamp(30px,5.5vw,52px);color:var(--sun);text-shadow:0 4px 0 rgba(0,0,0,.35);text-align:center;text-wrap:balance}
.dig .hint{margin:0;min-height:2.8em;max-width:640px;font-weight:700;font-size:clamp(18px,2.6vw,24px);text-align:center;color:var(--foam);text-wrap:balance}
.slab{position:relative;width:min(100%,calc(62vh*4/3),680px);aspect-ratio:4/3;border-radius:28px;overflow:hidden;touch-action:none;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.12),transparent 60%),
    radial-gradient(circle at 22% 70%,#9a835f 0 1.5px,transparent 2.5px) 0 0/23px 19px,#ae9874;
  box-shadow:0 10px 0 rgba(0,0,0,.35),inset 0 0 0 4px rgba(0,0,0,.18)}
.slab canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .9s ease-in}
.slab.clear canvas{opacity:0}
.slab .fos{position:absolute;left:50%;top:50%;width:36%;translate:-50% -50%}
.slab.clear .fos{animation:fosGlow 1.6s ease-out}
@keyframes fosGlow{0%{filter:drop-shadow(0 0 0 #fff6c8)}40%{filter:drop-shadow(0 0 18px #fff6c8);transform:scale(1.06)}100%{filter:drop-shadow(0 0 0 #fff6c8)}}
.slab .finger{position:absolute;left:50%;top:55%;font-size:64px;pointer-events:none;animation:rub 1.1s ease-in-out infinite alternate}
@keyframes rub{from{transform:translate(-90%,0) rotate(-12deg)}to{transform:translate(10%,8px) rotate(10deg)}}
.slab .bit{position:absolute;left:0;top:0;width:7px;height:6px;border-radius:2px;pointer-events:none}
.slab .twinkle{position:absolute;font-size:30px;pointer-events:none}
.fos svg,.plaque svg{display:block;width:100%;height:auto}
.dig .cta[hidden]{display:none}
/* Each set's fossil sits by its manta: a ？ stone until a perfect test digs it up. */
.reward.fosr{width:84px}
.reward.fosr .plaque{width:58px;margin:0 auto 2px}
.reward.fosr:not(.got) .plaque{display:grid;place-items:center;background:rgba(6,25,42,.5);color:var(--mist);font-size:26px;font-weight:900}

@media (prefers-reduced-motion: reduce){
  .swimmer,.swimmer .bob,.swimmer .face,.weed,.host .legs,.host .tk,.bcrab .legs,.bcrab .tk,.sting .bell,.cele .art,.carrier.in,.carrier.out,#board .start.pulse{animation:none!important}
}

const TOOTH='<svg viewBox="0 0 20 28"><path d="M1 0H19Q19 13 11.5 26.5Q10 28.5 8.5 26.5Q1 13 1 0Z" fill="#fffaf0" stroke="#e3d6c0" stroke-width="1.2"/><path d="M5 3Q6 11 8.5 17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';

// One socket per kanji, along the arc of each lip; teeth fill top, bottom, top, … from left to right.
function buildTeeth(n){
  const rows=[[$('jawTop'),Math.ceil(n/2)],[$('jawBot'),Math.floor(n/2)]];
  const sockets=rows.map(([jaw,m])=>{
    jaw.innerHTML=''; const span=Math.min(64,(m-1)*16);
    return Array.from({length:m},(_,i)=>{
      const x=50-span/2+(m>1?span*i/(m-1):0), u=(x-50)/54; // x in % of the screen width; the jaw is 108vw wide from -4vw
      const t=document.createElement('div'); t.className='tooth'; t.innerHTML=TOOTH;

}
// Move both jaws between off screen, open (round the edges of the screen) and shut (meeting in the middle).

  return Promise.all([[top,1],[$('jawBot'),-1]].map(([el,sg])=>{
    for(const a of el.getAnimations())a.cancel();
    return el.animate([{transform:`translateY(${sg*y[from]}px)`},{transform:`translateY(${sg*y[to]}px)`}],
      {duration:reduce?0:dur,easing,fill:'forwards'}).finished;
  }));
}

// a perfect test after that digs up the same fossil again, just for fun. It counts as found as soon as the dig opens.
// The fossil is small and hidden somewhere different each time, so most of the slab is empty and she has to hunt for it.
// Two layers cover it: loose sand that one rub clears, and rock under it that takes about three.
// Once most of the fossil's own patch is clear, the rest crumbles away.
function digFossil(si){

    const id=SECTIONS[si].fossil, F=FOSSILS[id], fos=P.fos=P.fos||{}, again=!!fos[si];
    fos[si]=1; save(); if(!again)GOOD.fossil=F.n;

    st.innerHTML=`<div class="cap">どこかに なにか うまってる！</div><div class="slab"><div class="fos">${fossilArt(id)}</div><canvas></canvas><canvas></canvas>${reduce?'':'<div class="finger">👆</div>'}</div>`+
      `<p class="hint">ゆびで こすって さがそう</p><button class="cta" hidden>やったー！</button>`;
    document.body.appendChild(st);
    const slab=st.querySelector('.slab'), [rock,sand]=st.querySelectorAll('canvas'), cap=st.querySelector('.cap'), hint=st.querySelector('.hint'), btn=st.querySelector('.cta');
    const W=slab.clientWidth, H=slab.clientHeight, dpr=Math.min(2,devicePixelRatio||1), r=seeded(id+Date.now());

    // and the rock canvas shows base with mask taking 35% off, so the rock wears away by time spent rubbing,
    // however many pointer events arrive. Every quarter second (and when she lifts her finger) that's kept in base.

      for(let j=1;j<=6;j++)x.quadraticCurveTo(W*(j-.5)/6,y+(r()-.5)*24,W*j/6,y+(r()-.5)*12); x.lineTo(W,y+H/14); x.lineTo(0,y+H/14); x.fill()}
    dots(x,['#5f4529','#a5835a','#4f3a24','#b9996f'],90,1.5,6);
    x=ctx[1]; x.fillStyle='#dcbb82'; x.fillRect(0,0,W,H);
    dots(x,['#c9a465','#efd9aa','#b8925a','#e6c891'],900,.6,1.8); dots(x,['#cfae72','#c49f60'],14,10,26);
    rx.drawImage(base,0,0);
    const R0=W*.032; let last={}, found=false, lastSound=0, lastBit=0, lastKeep=0, rubbed=false;
    // How much of the fossil's patch is clear of rock, checked on a small copy of the rock layer.
    const sm=document.createElement('canvas'); sm.width=48; sm.height=36; const smx=sm.getContext('2d',{willReadFrequently:true});
    function cleared(){
      smx.clearRect(0,0,48,36); smx.drawImage(rock,0,0,48,36); const d=smx.getImageData(0,0,48,36).data; let n=0,c=0;
      const ci=fx/W*48-.5, cj=fy/H*36-.5, ri=fw*.42/W*48, rj=fw*.42/H*36;
      for(let j=0;j<36;j++)for(let i=0;i<48;i++){if(((i-ci)/ri)**2+((j-cj)/rj)**2>1)continue; n++; if(d[(j*48+i)*4+3]<90)c++}

    // Crumbs of sand and rock flicked off by her finger.
    function bits(px,py,k,spread=1){
      for(let i=0;i<k;i++){

    slab.onpointerup=slab.onpointercancel=e=>{delete last[e.pointerId]; if(!found)keep()};

        for(let i=0;i<14;i++)bits(W*(.15+.7*Math.random()),H*(.15+.7*Math.random()),1,1.6);
        for(let i=0;i<8;i++){const s=document.createElement('span'); s.className='twinkle'; s.textContent='✨';
          s.style.left=W*(.1+.8*Math.random())-15+'px'; s.style.top=H*(.1+.8*Math.random())-15+'px'; slab.appendChild(s);
          s.animate([{transform:'scale(0)',opacity:1},{transform:'scale(1.3) rotate(60deg)',opacity:1,offset:.5},{transform:'scale(.4) rotate(120deg)',opacity:0}],{duration:1100,delay:200+i*90,fill:'both'}).onfinish=()=>s.remove()}
      }

    }
    btn.onclick=()=>{st.remove(); done()};
  });
}
// ---------- 100% on a test: the sea animals do a chicken dance ----------
// The dance's four moves, four times each: snap (パクパク), flap (パタパタ), wiggle down (フリフリ) and clap (パチパチ),
// then they swing round (くるくる). The moves follow SFX.chickenDance's beat. Tapping anywhere skips it.
const CD_E=.2; // one eighth note, in seconds
function chickenDance(){
  return new Promise(done=>{
    if(reduce)return done();
    const st=document.createElement('div'), ids=['dumbo','kcrab','octopus','kpuffer','kclown'];
    st.className='chicken';
    st.innerHTML=`<div class="cap"></div><div class="line">${ids.map(id=>`<div class="hen art">${art(id)}</div>`).join('')}</div>`;
    document.body.appendChild(st);
    const hens=[...st.querySelectorAll('.hen')], cap=st.querySelector('.cap'), timers=[], stop=SFX.chickenDance()||(()=>{});
    const at=(t,f)=>timers.push(setTimeout(f,t*1000));
    const end=()=>{timers.forEach(clearTimeout); stop(); st.remove(); done()};
    st.onclick=end;
    const bop=(h,mid,ms=180)=>h.animate([{transform:'none'},{transform:mid},{transform:'none'}],{duration:ms,easing:'ease-out'});
    const MOVES={
      snap:(h)=>bop(h,'scale(.78,1.18)',160),
      flap:(h,i)=>bop(h,`rotate(${i%2?16:-16}deg) translateY(-10px) scale(1.12,.92)`),
      wiggle:(h,i)=>bop(h,`translateY(${10+i*7}px) rotate(${i%2?12:-12}deg) scale(1.1,.88)`,190),
      clap:(h)=>{
        bop(h,'translateY(-28px) scale(1.06)',190);
        const r=h.getBoundingClientRect(), c=document.createElement('span'); c.className='pop'; c.textContent='👏';
        c.style.left=r.left+r.width/2-17+'px'; c.style.top=r.top-30+'px'; st.appendChild(c);
        c.animate([{transform:'scale(.5)',opacity:1},{transform:'translateY(-50px) scale(1.2)',opacity:0}],{duration:600,easing:'ease-out'}).onfinish=()=>c.remove();
      },
    };
    [['snap','パクパク！'],['flap','パタパタ！'],['wiggle','フリフリ！'],['clap','パチパチ！']].forEach(([m,label],k)=>{
      at(k*8*CD_E,()=>{cap.textContent=label; cap.animate([{transform:'scale(.4)',opacity:0},{transform:'scale(1.15)',opacity:1,offset:.6},{transform:'none',opacity:1}],{duration:300})});
      for(let i=0;i<4;i++)at((k*8+i)*CD_E,()=>hens.forEach(h=>MOVES[m](h,i)));
    });
    at(32*CD_E,()=>{
      cap.textContent='くるくる〜！';
      hens.forEach((h,j)=>{const d=j%2?-1:1; h.animate([0,1,2,3,4].map(q=>({transform:`rotate(${d*180*q}deg) translateY(${q%2?-24:0}px)`})),{duration:16*CD_E*1000,easing:'ease-in-out'})});
      st.querySelector('.line').animate([{transform:'none'},{transform:'translateX(-40px)'},{transform:'translateX(40px)'},{transform:'none'}],{duration:16*CD_E*1000,easing:'ease-in-out'});
    });
    at(48*CD_E+.9,end);
  });
}

  const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+dist(pts[i-1],pts[i]));

// Judged as a six-year-old writes: the stroke may drift and come out bigger or smaller than the guide,
// so position is checked loosely and shape is compared with the drift and size difference removed.
// Board is 109 units across.
const mid=a=>{let x=0,y=0;for(const q of a){x+=q.x;y+=q.y}return{x:x/a.length,y:y/a.length}};

const STRICT={where:20,shape:10};
function fits(u,t,rev){
  const tp=rev?[...t.pts].reverse():t.pts, tiny=t.len<16, ratio=u.len/t.len;
  const cu=mid(u.pts), ct=mid(tp); fits.last={ratio,off:dist(cu,ct)};
  if(ratio<(tiny?.25:.35)||ratio>(tiny?4:3))return false;
  if(dist(cu,ct)>(tiny?18:STRICT.where))return false;
  const k=tiny?1:Math.min(1.8,Math.max(.55,spread(tp,ct)/spread(u.pts,cu)));
  let m=0;
  for(let i=0;i<N;i++)m+=Math.hypot((u.pts[i].x-cu.x)*k-(tp[i].x-ct.x),(u.pts[i].y-cu.y)*k-(tp[i].y-ct.y));
  fits.last.shape=m/N;
  if(m/N>=(tiny?9:STRICT.shape))return false;
  // Direction: her stroke must run the same way as the guide (start to end), so a backwards line doesn't count.
  const du={x:u.pts[N-1].x-u.pts[0].x,y:u.pts[N-1].y-u.pts[0].y}, dt={x:tp[N-1].x-tp[0].x,y:tp[N-1].y-tp[0].y};
  fits.last.cos=(du.x*dt.x+du.y*dt.y)/(Math.hypot(du.x,du.y)*Math.hypot(dt.x,dt.y)||1);
  return tiny||du.x*dt.x+du.y*dt.y>.5*Math.hypot(du.x,du.y)*Math.hypot(dt.x,dt.y);

const ROUND=6;
let Q=null;
function startQuiz(){
  let pool=ORDER.filter(k=>{const p=prog(k);return p.t||p.w});
  if(pool.length<ROUND)pool=ORDER.slice();
  Q={items:shuffle(pool.slice()).slice(0,ROUND),i:0,score:0,res:[]};
  $('qResult').hidden=true; $('qPlay').hidden=false;
  show('quiz'); nextQ();
}
function dots(){$('qDots').innerHTML=Array.from({length:ROUND},(_,i)=>`<i class="${Q.res[i]===true?'ok':Q.res[i]===false?'miss':''}${i===Q.i?' now':''}"></i>`).join('')}
// Decoys that look like the answer, so it can't be picked by its ending alone.
// For a word shown with okurigana (青い), every option ends the same way: real readings first, then other
// kanji's stems plus that ending when too few real readings do. Otherwise options of the same length that share a sound come first.
function decoys(k,r){
  const ans=kana(r), mine=new Set(INFO[k].r.map(kana)), tail=r.split('|')[1]||'';
  const reads=ORDER.filter(x=>x!==k).flatMap(x=>INFO[x].r.filter(y=>y[0]!=='*'));
  const score=new Map();
  const add=(y,bonus)=>{if(mine.has(y)||score.has(y))return;
    score.set(y,bonus+(y.length===ans.length?2:0)+(y[0]===ans[0]?1:0)+(y.at(-1)===ans.at(-1)?1:0)+Math.random()*1.5)};
  if(tail)reads.forEach(y=>{const [stem,oku]=y.split('|');
    if(oku&&kana(y).endsWith(tail))add(kana(y),10); else if(!stem.endsWith('っ'))add(stem+tail,oku?1:0)});
  else reads.forEach(y=>{if(!y.includes('|'))add(y,0)});
  return [...score.keys()].sort((a,b)=>score.get(b)-score.get(a)).slice(0,2);
}
function nextQ(){

  dots();
  const k=Q.items[Q.i], r=pick(INFO[k].r.filter(r=>r[0]!=='*')), opts=[kana(r),...decoys(k,r)];
  Q.cur={k,ans:kana(r),miss:0};

// The tank: one option per lane so creatures never cross. Near the top a fish cruises or rests then dashes;

const LANES={

  mid:[{move:'swim',ids:['kturtle','kturtle2']},{move:'snake',ids:['ksnake']},{move:'jelly',ids:['kjelly','kjelly2']}],
  low:[{move:'walk',ids:['kcroc']},{move:'crab',ids:['kcrab']},{move:'eel',ids:['eel','eel2']},{move:'hide',ids:['octopus','octopus2','octopus3','dumbo']}],

  ksnake:[.6,.56],kjelly:[.5,.2],kjelly2:[.5,.2],kcroc:[.58,.46],kcrab:[.5,.22],eel:[.42,.18],eel2:[.42,.18],
  octopus:[.5,.11],octopus2:[.5,.11],octopus3:[.5,.11],dumbo:[.5,.14]};

addEventListener('resize',()=>{if(!TK)return; const t=$('qTank'); TK.W=t.clientWidth; TK.H=t.clientHeight; layoutTank()});
const ease=k=>1-(1-Math.min(1,Math.max(0,k)))**3;
function frame(now){

    // Back and forth across the tank, turning round at each wall.

    const next=(state,lo,hi)=>{a.state=state; a.t0=t; a.until=t+lo+Math.random()*(hi-lo)};
    switch(a.move){
      case 'swim': cruise(S*(a.lane==='top'?.38:.24)); a.y=lift+Math.sin(t*1.7+a.ph)*5; a.rot=Math.sin(t*1.7+a.ph+1)*3; break;

      case 'jelly': cruise(S*.12,false); a.y=lift+Math.sin(t*1.4+a.ph)*14; a.rot=Math.sin(t*.9+a.ph)*5; break;
      case 'walk':

        if(t>=a.until){if(a.state==='run')next('stop',.5,1.2); else{next('run',.6,1.3); a.dir=pick([-1,1])}}
        if(a.state==='run')cruise(S*.6,false);

    g.beginPath(); g.arc(sx+(p.X-sx)*u,sy+(p.Y-sy)*u-Math.sin(u*Math.PI)*w*.8,w*(.08+.04*Math.sin(i*2.3)),0,7); g.fill();
  }
}
// Two rockets on the back of her kart. On a boost they blaze: a white-hot core, flames licking down and out
// towards the camera, and sparks flying off.
function rRockets(g,w,fire,t){
  for(const sd of [-1,1]){
    const x=sd*w*.36, y=-w*.3, r=w*.075;
    if(fire){
      const fl=1+.18*Math.sin(t*47+sd)+.12*Math.sin(t*31), R=w*.2*fl*fire;
      // Flames: three tongues from the nozzle, fanning down and outwards.
      for(const [ang,len,col] of [[.6,1,'rgba(255,90,40,.85)'],[.35,.85,'rgba(255,170,40,.9)'],[.48,.6,'rgba(255,240,150,.95)']]){
        const a=Math.PI/2-sd*ang+.06*Math.sin(t*40+len*9), L=w*.75*len*fl*fire, ex=x+Math.cos(a)*L, ey=y+Math.sin(a)*L, nx=-Math.sin(a), ny=Math.cos(a), hw=r*1.1*len+r*.4;
        g.fillStyle=col; g.beginPath(); g.moveTo(x+nx*hw,y+ny*hw);
        g.quadraticCurveTo(x+nx*hw*1.4+(ex-x)*.5,y+ny*hw*1.4+(ey-y)*.5,ex,ey);
        g.quadraticCurveTo(x-nx*hw*1.4+(ex-x)*.5,y-ny*hw*1.4+(ey-y)*.5,x-nx*hw,y-ny*hw); g.fill();
      }
      const glow=g.createRadialGradient(x,y,0,x,y,R*1.6);
      glow.addColorStop(0,'rgba(255,255,255,1)'); glow.addColorStop(.3,'rgba(255,236,140,.95)'); glow.addColorStop(.6,'rgba(255,140,40,.6)'); glow.addColorStop(1,'rgba(255,80,30,0)');
      g.fillStyle=glow; g.beginPath(); g.arc(x,y,R*1.6,0,7); g.fill();
      // Sparks, each flying out along its own line and fading.
      for(let i=0;i<7;i++){
        const q=(t*3.1+i*.143+(sd>0?.07:0))%1, a=Math.PI/2-sd*(.25+((i*37)%10)/12), d=w*(.1+q*1.1);
        g.fillStyle=`rgba(255,${200+((i*53)%55)},120,${(1-q)*fire})`; g.beginPath(); g.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,w*.02*(1.3-q),0,7); g.fill();
      }
    }
    // The nozzle itself: a steel ring with a dark (or blazing) mouth.
    g.fillStyle='#8a97a8'; g.beginPath(); g.arc(x,y,r*1.35,0,7); g.fill();
    g.fillStyle='#d6dde6'; g.beginPath(); g.arc(x-r*.35,y-r*.35,r*.45,0,7); g.fill();
    g.fillStyle=fire?'#fff6c8':'#2a2f3a'; g.beginPath(); g.arc(x,y,r*.8,0,7); g.fill();
  }
}
function rGateDraw(g,gt,o){
  const t=RC.t;
  RV.lanes.forEach((l,j)=>{
    const X=o.X+o.s*l*RV.road*RC.W/2, r=420*o.k, cy=o.Y-r-120*o.k;
    if(gt.hit===j){
      // Popped: a ring of little bubbles flying apart.
      const a=t-gt.hitT; if(a>.6)return; g.fillStyle=`rgba(255,255,255,${1-a/.6})`;
      for(let i=0;i<10;i++){const u=i/10*6.28; g.beginPath(); g.arc(X+Math.cos(u)*r*(1+a*2),cy+Math.sin(u)*r*(1+a*2),r*.12,0,7); g.fill()}
      return;
    }
    g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(X,o.Y,r*.8,r*.15,0,0,7); g.fill();
    const bob=Math.sin(t*2.5+j)*r*.06, rg=g.createRadialGradient(X-r*.3,cy-r*.3+bob,r*.1,X,cy+bob,r);
    rg.addColorStop(0,'rgba(255,255,255,.55)'); rg.addColorStop(1,'rgba(160,230,255,.25)');
    g.fillStyle=rg; g.beginPath(); g.arc(X,cy+bob,r,0,7); g.fill();
    g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=Math.max(1,r*.06); g.stroke();
    g.fillStyle='#fffaf0'; g.beginPath(); g.arc(X,cy+bob,r*.72,0,7); g.fill();
    g.fillStyle='#22122f'; g.font=RKF.replace('%',Math.round(r*.95)); g.textAlign='center'; g.textBaseline='middle';
    g.fillText(gt.ks[j],X,cy+bob+r*.05);
  });
}
function rDeco(g,d,X,Y,k){
  const t=RC.t, h=d.h;
  g.lineCap='round';
  if(d.t==='kelp'){
    g.strokeStyle='#2fae6b'; g.lineWidth=Math.max(1,60*k);
    for(const o of [-90,0,90]){const top=Y-1500*h*k*(o?.8:1); g.beginPath(); g.moveTo(X+o*k,Y);
      for(let i=1;i<=4;i++){const yy=Y+(top-Y)*i/4; g.quadraticCurveTo(X+o*k+Math.sin(t*1.5+d.ph+i)*120*k,yy+(top-Y)/8,X+o*k+Math.sin(t*1.5+d.ph+i+1)*60*k,yy)} g.stroke()}
  }else if(d.t==='coral'||d.t==='coral2'){
    g.strokeStyle=d.t==='coral'?'#ff7f9e':'#ffa94d'; g.lineWidth=Math.max(1,90*k); const H=700*h*k;
    g.beginPath(); g.moveTo(X,Y); g.lineTo(X,Y-H*.6); g.lineTo(X-H*.3,Y-H); g.moveTo(X,Y-H*.6); g.lineTo(X+H*.35,Y-H*.95);
    g.moveTo(X,Y-H*.3); g.lineTo(X-H*.35,Y-H*.55); g.moveTo(X,Y-H*.35); g.lineTo(X+H*.3,Y-H*.5); g.stroke();
  }else if(d.t==='rock'){
    g.fillStyle='#5d6f86'; g.beginPath(); g.ellipse(X,Y,900*h*k,520*h*k,0,Math.PI,0); g.fill();
    g.fillStyle='rgba(255,255,255,.15)'; g.beginPath(); g.ellipse(X-250*h*k,Y-330*h*k,250*h*k,90*h*k,0,0,7); g.fill();
  }else{
    g.strokeStyle='#c98cff'; g.lineWidth=Math.max(1,45*k);
    for(let i=-3;i<=3;i++){g.beginPath(); g.moveTo(X+i*60*k,Y-150*k); g.quadraticCurveTo(X+i*140*k,Y-450*k,X+i*110*k+Math.sin(t*2+i+d.ph)*50*k,Y-600*h*k); g.stroke()}
    g.fillStyle='#8e5cc8'; g.beginPath(); g.ellipse(X,Y,330*k,180*k,0,Math.PI,0); g.fill();
  }
}

// ---------- backup (for grown-ups) ----------
// Progress lives only in this browser's storage, so a grown-up can save it as a small file
// (share sheet -> Save to Files, e.g. into iCloud Drive) and load it back after a wipe.
// A reminder shows on the home screen when the last backup is more than a month old.
const BKEY='kanjiSea.backupAt', MONTH=30*24*HOUR;
const backupAt=()=>{try{return +localStorage.getItem(BKEY)||0}catch(e){return 0}};
const ymd=t=>new Date(t).toLocaleDateString('ja-JP');
function renderBackup(){
  const at=backupAt(), any=ORDER.some(k=>{const p=prog(k);return p.t||p.w||p.r||p.s});
  $('backupWhen').textContent=at?`さいごの バックアップ: ${ymd(at)}`:'まだ バックアップ していません';
  $('backupNag').hidden=!any||Date.now()-at<MONTH;
}
async function backupSave(){
  const d=new Date(), name=`kanji-sea-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  const text=JSON.stringify({app:'kanjiSea',key:KEY,at:d.toISOString(),progress:P});
  const file=new File([text],name,{type:'application/json'});
  const done=()=>{try{localStorage.setItem(BKEY,Date.now())}catch(e){} renderBackup()};
  // Where sharing isn't allowed (a desktop browser, an embedded page), download the file instead.
  if(navigator.canShare?.({files:[file]})){
    try{await navigator.share({files:[file],title:name}); return done()}
    catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name;
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); done();
}
async function backupLoad(f){
  try{
    const o=JSON.parse(await f.text()), p=o.progress||o;
    if(!p||typeof p.k!=='object')throw new Error('not a かんじの うみ backup');
    const n=Object.values(p.k).filter(v=>v.s).length;
    if(!confirm(`${o.at?ymd(o.at)+' の ':''}バックアップに もどしますか？（ふくしゅう ${n}こ）\nいまの きろくは うわがき されます。\n\nRestore this backup? It replaces the progress on this device.`))return;
    P=p; P.sec=P.sec||{}; save();
    if(o.at)try{localStorage.setItem(BKEY,Date.parse(o.at))}catch(e){}
    renderHome();
  }catch(e){alert('もどせませんでした: '+e.message)}
}
